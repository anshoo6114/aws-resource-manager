name: Modify EC2 Instance Type

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'AWS region'
        required: true
        default: 'us-east-1'
      resource_ids:
        description: 'EC2 Instance IDs (space-separated)'
        required: true
      instance_type:
        description: 'New EC2 instance type (e.g., t3.micro)'
        required: true

jobs:
  modify_instance_type:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # ✅ Required for OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}   # ✅ Same IAM role as start/stop
          aws-region: ${{ inputs.region }}
          role-session-name: github-actions-session

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Change EC2 Instance Type
        run: |
          echo "🔧 Changing EC2 instance type..."
          for id in ${{ inputs.resource_ids }}; do
            echo "Stopping instance $id..."
            aws ec2 stop-instances --instance-ids $id --region ${{ inputs.region }}

            echo "Waiting until instance $id is stopped..."
            aws ec2 wait instance-stopped --instance-ids $id --region ${{ inputs.region }}

            echo "Modifying instance type to ${{ inputs.instance_type }}..."
            aws ec2 modify-instance-attribute \
              --instance-id $id \
              --instance-type "{\"Value\": \"${{ inputs.instance_type }}\"}" \
              --region ${{ inputs.region }}

            echo "Starting instance $id..."
            aws ec2 start-instances --instance-ids $id --region ${{ inputs.region }}

            echo "✅ Instance $id changed to type ${{ inputs.instance_type }}"
          done

      - name: Job Summary
        if: always()
        run: |
          echo "### ✅ EC2 Instance Type Modification Completed" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ inputs.region }}" >> $GITHUB_STEP_SUMMARY
          echo "**Instance IDs:** ${{ inputs.resource_ids }}" >> $GITHUB_STEP_SUMMARY
          echo "**New Type:** ${{ inputs.instance_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Success ✅" >> $GITHUB_STEP_SUMMARY
