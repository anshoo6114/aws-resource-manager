name: AWS Resource Manager

on:
  workflow_dispatch:
    inputs:
      resource:
        description: 'Resource type to manage'
        required: true
        type: choice
        options:
          - ec2
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - start
          - stop
          - status
          - list
          - change-instance-type   # ✅ New operation
      region:
        description: 'AWS region'
        required: false
        default: 'eu-north-1'
      resource_ids:
        description: 'Resource IDs (space-separated for EC2)'
        required: false
      instance_type:
        description: 'New EC2 instance type (e.g., t3.micro)'
        required: false

jobs:
  manage_resources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # ✅ same OIDC role as start/stop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}   # ✅ same role
          aws-region: ${{ inputs.region }}
          role-session-name: github-actions-session

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Run AWS Resource Manager
        env:
          RESOURCE: ${{ inputs.resource }}
          OPERATION: ${{ inputs.operation }}
          REGION: ${{ inputs.region }}
          RESOURCE_IDS: ${{ inputs.resource_ids }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
        run: |
          echo "Resource: $RESOURCE"
          echo "Operation: $OPERATION"
          echo "Region: $REGION"

          if [ "$OPERATION" = "change-instance-type" ]; then
            for id in $RESOURCE_IDS; do
              echo "Stopping instance $id..."
              aws ec2 stop-instances --instance-ids $id --region $REGION
              echo "Modifying instance type to $INSTANCE_TYPE..."
              aws ec2 modify-instance-attribute --instance-id $id --instance-type "{\"Value\": \"$INSTANCE_TYPE\"}" --region $REGION
              echo "Starting instance $id..."
              aws ec2 start-instances --instance-ids $id --region $REGION
              echo "✅ Instance $id changed to type $INSTANCE_TYPE"
            done
          else
            python aws_resource_manager.py \
              --resource "$RESOURCE" \
              --operation "$OPERATION" \
              --region "$REGION" \
              $([ -n "$RESOURCE_IDS" ] && echo "--ids $RESOURCE_IDS") \
              --json-output
          fi

      - name: Job Summary
        if: always()
        run: |
          echo "### ✅ AWS Resource Manager Completed" >> $GITHUB_STEP_SUMMARY
          echo "**Resource:** ${{ inputs.resource }}" >> $GITHUB_STEP_SUMMARY
          echo "**Operation:** ${{ inputs.operation }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ inputs.region }}" >> $GITHUB_STEP_SUMMARY
          echo "**Instance Type:** ${{ inputs.instance_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Success ✅" >> $GITHUB_STEP_SUMMARY
